name: "Configure AWS (OIDC)"
description: "Configure AWS credentials via OIDC and ensure aws-cli is available"
inputs:
  role-to-assume:
    description: "AWS role ARN to assume (e.g. from secrets)"
    required: true
  aws-region:
    description: "AWS region (e.g. us-east-1)"
    required: true
runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: Ensure AWS CLI v2 is available
      shell: bash
      run: |
        if ! command -v aws >/dev/null 2>&1; then
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp && /tmp/aws/install
        fi

    # optional: ensure kubectl is installed (uncomment if you want it here)
