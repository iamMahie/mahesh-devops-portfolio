name: Continuous Integration
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
permissions: {}
jobs:
  lint-and-test:
    name: Lint with ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Run pytest against PostgreSQL database
    # Set up postgres service and run tests
    services:
      postgres:    # Label used to access the service container
        image: postgres:15-alpine
        # Set environment variables
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        # Add health check to ensure database is ready
        options: >-
          --health-cmd pg_isready -U $postgres -d postgres
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          5432:5432

    steps:
    # checkout the repository and set up Python environment
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'   # Speed up the future runs by caching dependencies
      
    # Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip 
        pip install -r wed-studiozs/requirements.txt
        pip install ruff pytest pytest-cov
    
    # checkout ruff and run the linter
    - name: Lint with ruff
      run: ruff check .
      continue-on-error: false # Fail the job if ruff finds any issues
      
    - name: Run tests with pytest
    # Run pytest with coverage reporting
    # Generate coverage report in XML format and display missing lines in the terminal and fail if coverage is below 80%
      run: |
        pytest --cov=. --cov-report=xml --cov-report=term-missing  --cov-fail-under=80

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
    steps:
    # checkout the repository and set up Docker environment
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker Image with Caching
      uses: docker/build-push-action@
      with:
        context: .
        file: Docker/Dockerfile
        push: false
        tag: wed-studiozs:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Vulnerbility Scan with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'wed-studiozs:${{ github.sha }}'
        format: 'table'  # To view the scan results in a table format
        exit-code: '1'  # Exit with code 1 if vulnerabilities are found -- failing the job
        ignore-unfixed: true   # This flag fails the build if a vulnerability is discovered and a patch has not been applied
        severity: 'CRITICAL,HIGH'

    - name: Generate SBOM with Syft
      uses: anchore/sbom-action@v0
      with:
        path: .
        format: spdx-json
        output-file: sbom.spdx.json

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: sbom.spdx.json


