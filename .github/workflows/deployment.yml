name: Continous Deployment
on:
  push:
    branches:
      - main
permissions: {}
jobs:
  deployment:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    # Setup docker builds -> Build and push the dokcer image into GitHub Container RegistryS
  
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
  
    # Login to AWS Elastic Container Registry with OIDC (Open ID Connect)
  
    - name: Setup up Docker Buildx
      uses: docker/setup-buildx-action@v4
  
    - name: Build Docker Image with Caching
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Docker/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/wed-studiozs:${{ github.sha }}
          ghcr.io/${{ github.repository_owner }}/wed-studiozs:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
