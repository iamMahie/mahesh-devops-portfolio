name: Continuous Deployment
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write      # Required for AWS OIDC Token
env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: wed-studiozs-cluster
  ECR_IMAGE: public.ecr.aws/v3k4k2v5/devops_projects
  K8S_NAMESPACE: wed-studiozs
  K8S_DEPLOYMENT: wed-studiozs-deployment
  K8S_CONTAINER: wed-studiozs-app

jobs:
  push-to-ecr:
    name: Push Docker Image to ECR
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Login to AWS Elastic Container Registry with OIDC (Open ID Connect)
    - name: Configure AWS credentials (OIDC)
      uses: ./.github/actions/configure-aws
      with:
        role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
        aws-region: us-east-1 # ecr public login control plane is in us east 1 region

    - name: Login to Amazon ECR Public
      run: |
        aws ecr-public get-login-password --region ${{ env.AWS_REGION }} \
          | docker login --username AWS --password-stdin public.ecr.aws

    - name: Setup up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Build and Push docker image into ECR
    - name: Build Docker Image with Caching
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Docker/Dockerfile
        push: true
        tags: |
          ${{ env.ECR_IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: push-to-ecr
    env:
      ENVIRONMENT: testing
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      SECRET_KEY: ${{ secrets.SMOKE_TEST_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'   # Speeds up subsequent runs by caching dependencies
      
      - name: Install Testing Utilities
        run: |
          pip install -r wed-studiozs/requirements.txt
          pip install pytest requests

      # Login to AWS Elastic Container Registry with OIDC (Open ID Connect)
      - name: Configure AWS credentials (OIDC)
        id: login-ecr-public
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_EKS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin public.ecr.aws

      # Docker compose up automatically pulls and runs the image from ECR
      - name: Start services with docker compose
        run: |
          docker compose -f Docker/docker-compose.yml -f Docker/docker-compose.ci.yml up -d

      - name: Fetch service diagnostics
        if: failure()
        run: |
          docker compose \
            -f Docker/docker-compose.yml \
            -f Docker/docker-compose.ci.yml \
            ps -a

          docker compose \
            -f Docker/docker-compose.yml \
            -f Docker/docker-compose.ci.yml \
            logs --no-color --tail=200 database db-migration web

      - name: Wait for app readiness
        run: |
          for i in {1..60}; do
            if curl -sSf http://127.0.0.1:8000/readyz; then
              echo "ready"; break
            fi
            sleep 1
          done
          if ! curl -sSf http://127.0.0.1:8000/readyz; then
            docker compose -f Docker/docker-compose.yml -f Docker/docker-compose.ci.yml logs || true
            docker compose -f Docker/docker-compose.yml -f Docker/docker-compose.ci.yml down -v || true
            exit 1
          fi

      # Running py test scripts
      - name: Run Pytest Smoke Gate
        run: |
          pytest wed-studiozs/tests -v

      - name: Tear Down Compose
        if: always()
        run: |
          docker compose -f Docker/docker-compose.yml -f Docker/docker-compose.ci.yml down -v

  deploy-to-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        id: login-to-ecr
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_EKS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Verify Identity via AWS STS
        run: |
          aws sts get-caller-identity

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
      
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name "$EKS_CLUSTER"

      - name: Install Gateway API CRDs
        run: |
          kubectl apply \
            --server-side \
            -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.1/standard-install.yaml

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Traefik Gateway controller
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo update
          helm upgrade --install traefik traefik/traefik \
            --version 42.1.0 \
            --namespace traefik \
            --create-namespace \
            --set providers.kubernetesGateway.enabled=true \
            --set gateway.enabled=false \
            --set gatewayClass.enabled=true \
            --set gatewayClass.name=traefik \
            --wait \
            --timeout 10m

      - name: Render release image
        run: |
          kubectl kustomize KubernetesConfig/base \
            | sed "s|$ECR_IMAGE:[^[:space:]]*|$ECR_IMAGE:$GITHUB_SHA|g" \
            > /tmp/wed-studiozs.yaml

      - name: Remove previous migration Job
        run: |
          kubectl delete job db-migration-job \
            --namespace "$K8S_NAMESPACE" \
            --ignore-not-found

      - name: Deploy staging resources
        run: |
          kubectl apply -f /tmp/wed-studiozs.yaml

      - name: Wait for PostgreSQL
        run: |
          kubectl rollout status \
            statefulset/postgres \
            --namespace "$K8S_NAMESPACE" \
            --timeout=10m

      - name: Wait for database migration
        run: |
          kubectl wait \
            --for=condition=complete \
            job/db-migration-job \
            --namespace "$K8S_NAMESPACE" \
            --timeout=10m

      - name: Verify rollout
        run: |
          kubectl rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            --timeout=10m

      - name: Show deployed Pods
        run: |
          kubectl get pods \
            --namespace "$K8S_NAMESPACE" \
            -o wide

      - name: Show deployment diagnostics
        if: failure()
        run: |
          kubectl get pods,job,pvc,svc,endpoints \
            --namespace "$K8S_NAMESPACE" \
            -o wide || true
          kubectl get events \
            --namespace "$K8S_NAMESPACE" \
            --sort-by=.lastTimestamp || true
          kubectl logs job/db-migration-job \
            --namespace "$K8S_NAMESPACE" \
            --all-containers \
            --tail=200 || true
          kubectl describe deployment/"$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" || true