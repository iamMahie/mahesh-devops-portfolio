name: Continuous Deployment
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write      # Required for AWS OIDC Token
env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: wed-studiozs-cluster
  ECR_IMAGE: public.ecr.aws/v3k4k2v5/devops_projects
  K8S_NAMESPACE: wed-studiozs
  K8S_DEPLOYMENT: wed-studiozs-deployment
  K8S_CONTAINER: wed-studiozs-app

jobs:
  push-to-ecr:
    name: Push Docker Image to ECR
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Login to AWS Elastic Container Registry with OIDC (Open ID Connect)
    - name: Configure AWS credentials (OIDC)
      uses: ./.github/actions/configure-aws
      with:
        role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
        aws-region: us-east-1 # ecr public login control plane is in us east 1 region

    - name: Login to Amazon ECR Public
      run: |
        aws ecr-public get-login-password --region ${{ env.AWS_REGION }} \
          | docker login --username AWS --password-stdin public.ecr.aws

    - name: Setup up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Build and Push docker image into ECR
    - name: Build Docker Image with Caching
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Docker/Dockerfile
        push: true
        tags: |
          ${{ env.ECR_IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: push-to-ecr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: 'pip'   # Speeds up subsequent runs by caching dependencies
      
      - name: Install Testing Utilities
        run: |
          pip install -r wed-studiozs/requirements.txt
          pip install pytest requests

      # Login to AWS Elastic Container Registry with OIDC (Open ID Connect)
      - name: Configure AWS credentials (OIDC)
        id: login-ecr-public
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_EKS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin public.ecr.aws

      # Docker compose up automatically pulls and runs the image from ECR
      - name: Start services with docker compose
        run: |
          docker compose -f Docker/docker-compose.yml -f Docker/docker-compose.ci.yml up -d

      - name: Fetch the logs of database service
        run: |
          docker compose -f Docker/docker-compose.yml -f Docker/docker-compose.ci.yml logs database --no-color --tail=200

      - name: Wait for app readiness
        run: |
          for i in {1..60}; do
            if curl -sSf http://127.0.0.1:8000/readyz; then
              echo "ready"; break
            fi
            sleep 1
          done
          if ! curl -sSf http://127.0.0.1:8000/readyz; then
            docker compose -f Docker/docker-compose.yml -f Docker/docker-compose.ci.yml logs || true
            docker compose -f Docker/docker-compose.yml -f Docker/docker-compose.ci.yml down -v || true
            exit 1
          fi

      # Running py test scripts
      - name: Run Pytest Smoke Gate
        run: |
          pytest wed-studiozs/tests -v

      - name: Tear Down Compose
        if: always()
        run: |
          docker compose -f Docker/docker-compose.yml -f Docker/docker-compose.ci.yml down -v

  deploy-to-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - name: Configure AWS credentials (OIDC)
        id: login-to-ecr
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_EKS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
      
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Update staging Deployment
        run: |
          kubectl set image \
            deployment/"$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER"="$ECR_IMAGE:$GITHUB_SHA" \
            --namespace "$K8S_NAMESPACE"

      - name: Verify rollout
        run: |
          kubectl rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            --timeout=5m
          || (kubectl rollout undo deployment/"$K8S_DEPLOYMENT" --namespace "$K8S_NAMESPACE" && exit 1)
            --timeout=5m
          || (kubectl rollout undo deployment/"$K8S_DEPLOYMENT" --namespace "$K8S_NAMESPACE" && exit 1)

      - name: Show deployed Pods
        run: |
          kubectl get pods \
            --namespace "$K8S_NAMESPACE" \
            -o wide