name: Continous Deployment
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
permissions: {}
env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: wed-studiozs-cluster
  ECR_IMAGE: public.ecr.aws/v3k4k2v5/devops_projects/wed-studiozs
  K8S_NAMESPACE: wed-studiozs
  K8S_DEPLOYMENT: wed-studiozs-deployment
  K8S_CONTAINER: wed-studiozs-app

jobs:
  push-to-ecr:
    name: Push Docker Image to ECR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # Required for AWS OIDC Token
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Login to AWS Elastic Container Registry with OIDC (Open ID Connect)
    - name: Configure AWS and ECR
      uses: iammahie/aws-oidc-action@v1
      with:
        aws_region: us-east-1
        role_to_assume: ${{ secrets.AWS_OIDC_ROLE }}
        enable_ecr_login: true
        ecr_registry: public.ecr.aws/v3k4k2v5/devops_projects

    - name: Setup up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Build and Push docker image into ECR
    - name: Build Docker Image with Caching
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Docker/Dockerfile
        push: true
        tags: |
          public.ecr.aws/v3k4k2v5/devops_projects/wed-studiozs:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: push-to-ecr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: 'pip'   # Speeds up subsequent runs by caching dependencies
      
      - name: Install Testing Utilities
        run: |
          pip install -r requirements.txt

      # Login to AWS Elastic Container Registry with OIDC (Open ID Connect)
      - name: Configure AWS and ECR
        id: login-ecr-public
        uses: iammahie/aws-oidc-action@v1
        with:
          aws_region: us-east-1
          role_to_assume: ${{ secrets.AWS_OIDC_ROLE }}
          enable_ecr_login: true
          ecr_registry: public.ecr.aws/v3k4k2v5/devops_projects

      # Docker compose up automatically pulls and runs the image from ECR
      - name: Spin Up Smoke Test Contianer
        env:
          REGISTRY: ${{ steps.login-ecr-public.outputs.registry  }}
        run: |
          docker run -d \
            --name smoke-tests \
            -p 8000:8000 \
            ${REGISTRY}/wed-studiozs:${{ github.sha }}

      # Running py test scripts
      - name: Run Pytest Smoke Gate
        run: |
          pip install pytest requests
          pytest wed-studiozs/tests/conftest.py -v

      - name: Tear Down Container
        if: always()
        run: |
          docker stop smoke-tests
          docker rm smoke-tests

  deploy-to-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: smoke-test
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS and ECR
        id: login-to-ecr
        uses: iammahie/aws-oidc-action@v1
        with:
          aws_region: us-east-1
          role_to_assume: ${{ secrets.AWS_OIDC_ROLE }}
          enable_ecr_login: true
          ecr_registry: public.ecr.aws/v3k4k2v5/devops_projects

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Update staging Deployment
        run: |
          kubectl set image \
            deployment/"$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER"="$ECR_IMAGE:$GITHUB_SHA" \
            --namespace "$K8S_NAMESPACE"

      - name: Verify rollout
        run: |
          kubectl rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            --timeout=180s

      - name: Show deployed Pods
        run: |
          kubectl get pods \
            --namespace "$K8S_NAMESPACE" \
            -o wide
        


