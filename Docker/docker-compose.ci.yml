version: "3.8"

services:
  web:
    image: "${ECR_IMAGE}:${GITHUB_SHA}"
    container_name: wed-studiozs-web
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-ci}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}"
      SECRET_KEY: "${SECRET_KEY}"
    networks:
      - wed-studiozs
      - wed-studiozs-pgdb
    depends_on:
      - database

networks:
  wed-studiozs:
    external: false
  wed-studiozs-pgdb:
    external: false