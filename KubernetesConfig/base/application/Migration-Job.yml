apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration-job
  namespace: wed-studiozs
spec:
  backoffLimit: 3                       # The number of retries before considering the job as failed
  activeDeadlineSeconds: 500            # The maximum time in seconds that the job is allowed to run before being terminated
  ttlSecondsAfterFinished: 86400          # The time in seconds to retain the job after it has completed (either succeeded or failed)
  template:
    metadata:
      labels:
        app: wed-studiozs-app
    spec:
      restartPolicy: Never               # The job will not restart the pod if it fails
      securityContext:
        runAsNonRoot : true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: 
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - /bin/sh
            - -c
            - until pg_isready -h postgres.wed-studiozs.svc.cluster.local -U wedstudiozs -d wed-studiozs; do sleep 2; done
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: db-migration
          securityContext: 
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: 
              drop: ["ALL"]
          image: public.ecr.aws/v3k4k2v5/devops_projects:e9c092677149cab59199c82f46f0d9a1d13b2efa
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"] # Command to run the database migrations
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: wed-studiozs-configmap, key: POSTGRES_USER } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: wed-studiozs-configmap, key: POSTGRES_DB } }
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: wed-studiozs-configmap, key: POSTGRES_HOST } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: wed-studiozs-secret, key: POSTGRES_PASSWORD } }
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: wed-studiozs-secret, key: SECRET_KEY } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: wed-studiozs-secret, key: DATABASE_URL } }
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"