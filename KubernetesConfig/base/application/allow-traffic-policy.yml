apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-traffic
  namespace: wed-studiozs
spec:
  podSelector:
    matchLabels:
      app: wed-studiozs-app              # Apply to pods with label wed-studiozs-app
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: application-gateway
      ports:
        - protocol: TCP
          port: 8000

  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-traffic
  namespace: wed-studiozs
spec:
  podSelector:
    matchLabels:
      app: postgres

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wed-studiozs-app
      ports:
        - protocol: TCP
          port: 5432